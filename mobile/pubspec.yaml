name: lang_giao_tac_mobile
description: "Ứng dụng di động Làng Giao Tác (Hà Tĩnh) kết nối cộng đồng, lưu giữ ký ức và văn hóa quê hương."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & APIs
  http: ^1.2.2
  dio: ^5.7.0

  # Local Storage & Security
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Device Features (Camera, Gallery, Sharing, URL Launcher)
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  photo_view: ^0.15.0

  # Google Authentication
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
